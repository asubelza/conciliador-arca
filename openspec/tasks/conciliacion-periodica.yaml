- [x] T44: Migraciones: `tenants.tolerancia_dias_fecha` (default 5, CHECK 0–365), tabla `fuzzy_match_confirmations` (confirmado/descartado por par sistema/ARCA), `periodo_resultados.classification` admite `'posible_coincidencia'` + columna `similarity_reason` (RF-04/RF-13) (S, db, PR-7) — 019/020/021_*.sql
- [x] T45: Motor de matching: fallback de similitud cuando la clave exacta no encuentra nada — Paso A (typo de 1 dígito en `numero`, mismo `punto_venta`, fecha exacta, importe con tolerancia) y Paso B (fecha dentro de `tolerancia_dias_fecha` + importe con tolerancia, `numero`/`punto_venta` libres); una fila `posible_coincidencia` NUNCA se promueve sola a `conciliado_ok` — requiere confirmación explícita del contador; un par `confirmado` en `fuzzy_match_confirmations` se trata igual que un match de clave exacta en la siguiente corrida (RF-04/RF-16) (L, api, PR-7) — periodo-matching-engine.ts
