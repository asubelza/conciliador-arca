## Verification Discipline (unchanged from PR-1/2/3)

Cada tarea se verifica contra Postgres/Redis reales (no solo jest con mocks), se sincroniza a la máquina del usuario, y se confirma con `git log`/`git show --stat` corridos directamente sobre su repo antes de marcarse como hecha — mismo estándar que se aplicó en todo `mvp-carga-comprobantes` y en el fix de `libro_iva_compras`.
