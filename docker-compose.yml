services:
  postgres:
    image: postgres:16
    container_name: conciliador-pg
    environment:
      POSTGRES_USER: conciliador
      POSTGRES_PASSWORD: conciliador
      POSTGRES_DB: conciliador_arca
    ports:
      - "5432:5432"
    volumes:
      - conciliador-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliador -d conciliador_arca"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: conciliador-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies prisma/migrations/*.sql (tracked in a schema_migrations
  # table, so it's safe to re-run every `docker compose up` against a
  # Postgres volume that already has some/all of them applied) and seeds the
  # 15 AFIP tipos. Exits when done; api/worker wait for it to succeed.
  # No `build:` here on purpose -- api's build produces conciliador-api-app:local
  # and this service just reuses that tag. Every service having its own
  # `build:` block for the SAME image tag causes `docker compose up --build`
  # to build all three concurrently and race exporting to the same tag
  # ("image ... already exists"), which is exactly what happened the first
  # time this was tried. Only one service may own the build.
  migrate:
    image: conciliador-api-app:local
    container_name: conciliador-migrate
    # NOTE: parenthesized on purpose. `A && B || true` makes a *migrate-runner*
    # failure non-fatal too (shell precedence: `(A && B) || true`), not just a
    # seed-runner failure -- which is what actually happened on a real
    # deployment: migrate-runner failed on every run since conciliacion-periodica
    # landed (schema_migrations was missing backfilled rows for migrations
    # already applied by hand before the tracker existed), the container still
    # exited 0, and migrations 012-018 silently never applied for who knows how
    # long. `depends_on: condition: service_completed_successfully` never caught
    # it because "completed successfully" was true from the shell's point of
    # view. Only seed-runner failures should be swallowed.
    command: sh -c "node dist/migrate-runner.js && (node dist/seed-runner.js || true)"
    environment:
      DATABASE_URL: postgresql://conciliador:conciliador@postgres:5432/conciliador_arca
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: conciliador-api-app:local
    container_name: conciliador-api
    command: node dist/main.js
    environment:
      DATABASE_URL: postgresql://conciliador:conciliador@postgres:5432/conciliador_arca
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # T34/T35 (autenticacion-roles): auth.service.ts (login) and
      # auth-guard.ts (every protected endpoint) both need this to sign/verify
      # JWTs -- jwt.ts throws "JWT_SECRET is not set" with no fallback on
      # purpose (a real deploy must set its own), but this docker-compose
      # service definition was never updated when Fase 1 added that
      # requirement, so every login against this local stack failed with a
      # 500 until this was added. Only `api` needs it -- `worker` never
      # touches the auth module. Fixed value here (not a real secret, this is
      # a local single-tenant dev/internal deployment, same trust level as
      # POSTGRES_PASSWORD above) -- rotate it if this ever needs to survive
      # being shared beyond this machine.
      JWT_SECRET: "5lwvp8aTXVBhlUED1Syq12iL19kBnUGonwXfd/9X5TMlkMRv+Fmeea83aCCKFts0"
    ports:
      - "3002:3000"
    volumes:
      # api writes uploaded files to os.tmpdir()/conciliador-uploads
      # (reconciliations.controller.ts) and the worker reads them back by
      # path from the same job's data -- as separate containers they don't
      # share a filesystem by default, so without this the worker crashes
      # with ENOENT the moment it tries to open a file the api just wrote.
      # Confirmed by reproducing the crash without this volume first.
      - conciliador-uploads:/tmp/conciliador-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # No `build:` here either -- same reason as migrate, above.
  worker:
    image: conciliador-api-app:local
    container_name: conciliador-worker
    command: node dist/reconciliations/reconciliation.worker.main.js
    environment:
      DATABASE_URL: postgresql://conciliador:conciliador@postgres:5432/conciliador_arca
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - conciliador-uploads:/tmp/conciliador-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Baked into the browser bundle at build time -- must be reachable
        # from the user's browser on the host, not the Docker network, so
        # this is localhost:3000 (the api service's published port), not
        # http://api:3000 (which only resolves between containers).
        NEXT_PUBLIC_API_URL: http://localhost:3002
    container_name: conciliador-web
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  conciliador-pg-data:
  conciliador-uploads:
